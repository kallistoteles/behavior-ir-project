name: project-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: project-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: python3 -B -m unittest discover -s scripts/tests -p 'test_*.py'
      - run: python3 scripts/check-docs.py
      - run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD
